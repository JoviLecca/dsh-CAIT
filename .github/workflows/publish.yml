name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example v1.0.3'
        required: true

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC); no NPM_TOKEN secret needed

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Trusted Publishing needs npm 11.5.1 or newer; Node 24's bundled npm may
      # be older than that.
      - name: Update npm
        run: npm install --global npm@latest

      - name: Install dev dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Refuse a tag that does not match package.json
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "release tag '$TAG' does not match package version '$expected'" >&2
            exit 1
          fi

      # prepublishOnly rebuilds client.js from client/ and runs node --check.
      - name: Run the test suite
        run: |
          set -euo pipefail
          for file in _dev/test-*.mjs; do
            echo "== $file"
            node "$file"
          done

      # prepublishOnly rebuilds client.js from client/ and runs node --check.
      - name: Publish
        run: npm publish --provenance --access public
